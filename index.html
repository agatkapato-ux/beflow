<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapisy na warsztaty – Fundacja BeFlow</title>
<style>
  :root {
    --sage: #9aa795;
    --teal: #03363f;
    --teal2: #0a4a55;
    --cream: #e6e4d6;
    --card: #647a60;
    --ink: #12302f;
    --muted: #455653;
    --line: #cfd3c4;
    --error: #a3231b;
    --ok-bg: #e1eadf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: var(--ink);
    font: 17px/1.55 Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 8px; }
  .brand { text-align: center; margin-bottom: 26px; min-height: 44px; }
  .brand img { height: 56px; width: auto; max-width: 100%; }
  .brand .brand-text { font-weight: 600; font-size: 1.5rem; letter-spacing: .04em; color: var(--teal); text-transform: uppercase; }
  h1 {
    display: inline-block; margin: 0 0 10px;
    background: var(--teal); color: #fff;
    font-size: 1.5rem; line-height: 1.25; text-transform: uppercase; font-weight: 800;
    padding: 8px 14px;
  }
  .lead { margin: 6px 0 0; color: var(--teal); font-weight: 500; }
  main { padding: 18px 0 28px; display: grid; gap: 20px; }
  .card { background: var(--card); color: #fff; border-radius: 14px; padding: 22px; }
  .card h2 {
    display: inline-block; margin: 0 0 12px;
    background: var(--teal); color: #fff;
    font-size: 1.2rem; line-height: 1.3; font-weight: 800; padding: 7px 12px;
  }
  .desc { margin: 8px 0 4px; white-space: pre-line; }
  .info { margin: 16px 0 0; }
  .tag {
    display: inline-block; background: var(--teal); color: #fff;
    font-weight: 700; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 9px; margin-bottom: 6px;
  }
  .val { white-space: pre-line; }
  .sessions { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
  .sessions li { padding: 8px 12px; background: var(--cream); color: var(--ink); border-radius: 8px; font-size: .97rem; }
  .sessions .note { display: block; color: var(--muted); font-size: .88rem; }
  .more { margin: 16px 0 0; }
  .more a { text-decoration: underline; }
  .card a { color: #fff; font-weight: 600; }
  .count { color: #fff; font-size: .93rem; margin: 18px 0 14px; }
  button, .btn {
    font: inherit; font-weight: 700;
    background: var(--cream); color: var(--teal);
    border: 0; border-radius: 10px;
    padding: 12px 22px; cursor: pointer; min-height: 46px;
  }
  button:hover { background: #ffffff; }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { background: transparent; color: #fff; border: 2px solid #fff; }
  button.secondary:hover { background: rgba(255,255,255,.18); }
  :focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
  form { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.45); display: grid; gap: 14px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: .93rem; }
  input[type=text], input[type=email] {
    font: inherit; font-weight: 400; width: 100%;
    padding: 11px 12px; border: 1px solid #8e9889; border-radius: 8px; background: #fff;
  }
  .consent { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-weight: 400; font-size: .9rem; }
  .consent input { width: 20px; height: 20px; margin-top: 3px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .error { color: var(--error); font-weight: 600; margin: 0; }
  .card .error { background: #fff; padding: 8px 12px; border-radius: 8px; }
  .error:empty { display: none; }
  .success { background: var(--ok-bg); color: var(--ink); border-radius: 10px; padding: 16px; margin-top: 16px; }
  .success h3 { margin: 0 0 6px; }
  .linkbox { display: grid; gap: 8px; margin-top: 10px; }
  .linkbox input { font: inherit; font-size: .85rem; width: 100%; padding: 10px; border: 1px solid #8e9889; border-radius: 8px; background: #fff; }
  .muted, .empty { color: var(--teal); }
  footer { padding: 4px 0 36px; color: var(--teal); font-size: .88rem; text-align: center; }
  footer a { color: inherit; font-weight: 600; }
  .funders { background: transparent; border-radius: 12px; padding: 14px; margin: 0 0 18px; display: none; gap: 22px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .funders.show { display: flex; }
  .funders img { height: 46px; width: auto; max-width: 100%; }
  .funding-note { margin: 0 0 14px; }
  @media (max-width: 480px) { h1 { font-size: 1.25rem; } .card { padding: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand"><span class="brand-text" id="brandText">Fundacja BeFlow</span></div>
    <h1>Zapisy na warsztaty</h1>
    <p class="lead">Wybierz warsztat i zapisz się w kilka chwil.</p>
  </header>
  <main id="app" aria-live="polite"><p class="muted">Ładowanie…</p></main>
  <footer id="footer"></footer>
</div>

<script>
// ---------- Ustawienia ----------
const CONFIG = {
  SUPABASE_URL: 'https://rsqwcvbixkdfcxfgwhym.supabase.co',
  SUPABASE_KEY: 'sb_publishable_VDS7OzDzHnpGkFCKgigIKQ_Dn0yC54p', // klucz publiczny - tak ma być
  FOUNDATION_NAME: 'Fundacja BeFlow',
  WEBSITE_URL: '',      // <- adres strony fundacji (opcjonalnie)
  PRIVACY_URL: '',      // <- link do polityki prywatności (opcjonalnie)
  CONTACT_EMAIL: '',    // <- e-mail kontaktowy fundacji (opcjonalnie)
  FUNDING_NOTE: '',     // <- tekst o dofinansowaniu, jeśli wymaga go grant (opcjonalnie)
  SHOW_CANCEL_LINK: true, // <- zmień na false, gdy działa wysyłka e-maili z potwierdzeniem (przycisk rezygnacji będzie w mailu)
  // Pliki z logotypami wrzuć do folderu "img" w repozytorium. Brakujące pliki są pomijane.
  LOGO: 'img/logo.png',
  FUNDER_LOGOS: [
    { src: 'img/komitet.png', alt: 'Komitet do Spraw Pożytku Publicznego' },
    { src: 'img/niw.png', alt: 'Narodowy Instytut Wolności – Centrum Rozwoju Społeczeństwa Obywatelskiego' },
    { src: 'img/nowe-fio.png', alt: 'Rządowy Program Fundusz Inicjatyw Obywatelskich NOWE FIO na lata 2021–2030' }
  ]
};

const TZ = 'Europe/Warsaw';
const app = document.getElementById('app');

// ---------- Pomocnicze ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

async function rpc(name, args) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_KEY },
    body: JSON.stringify(args || {})
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* pusta odpowiedź */ }
  if (!res.ok) throw new Error((data && data.message) || 'network');
  return data;
}

const ERRORS = {
  consent_required: 'Aby się zapisać, zaznacz zgodę na przetwarzanie danych.',
  workshop_unavailable: 'Ten warsztat nie przyjmuje już zapisów. Odśwież stronę.',
  already_signed_up: 'Ten adres e-mail jest już zapisany na ten warsztat.',
  invalid_data: 'Sprawdź, czy imię, nazwisko i adres e-mail są poprawne.',
  not_found: 'Nie znaleziono zapisu. Link mógł wygasnąć lub być niepoprawny.'
};
const errText = (e) => ERRORS[e.message] || 'Coś poszło nie tak. Spróbuj ponownie za chwilę.';

const fmtDay = new Intl.DateTimeFormat('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: TZ });
const fmtTime = new Intl.DateTimeFormat('pl-PL', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
function sessionLabel(s) {
  const start = new Date(s.starts_at);
  let t = `${fmtDay.format(start)}, ${fmtTime.format(start)}`;
  if (s.ends_at) t += `–${fmtTime.format(new Date(s.ends_at))}`;
  return t;
}

function info(label, content) {
  return h('div', { class: 'info' }, h('span', { class: 'tag' }, label), h('div', { class: 'val' }, content));
}

// ---------- Lista warsztatów ----------
function renderWorkshops(list) {
  app.replaceChildren();
  if (!list.length) {
    app.append(h('p', { class: 'empty' }, 'Obecnie nie ma otwartych zapisów. Zajrzyj tu wkrótce.'));
    return;
  }
  list.forEach((w) => app.append(workshopCard(w)));
}

function workshopCard(w) {
  const countEl = h('span', {}, w.participant_count);
  const formBox = h('div');
  const btn = h('button', { type: 'button', 'aria-expanded': 'false' }, 'Zapisz się');
  btn.addEventListener('click', () => {
    if (formBox.childElementCount) {
      formBox.replaceChildren();
      btn.textContent = 'Zapisz się';
      btn.setAttribute('aria-expanded', 'false');
    } else {
      formBox.append(signupForm(w, formBox, countEl, btn));
      btn.textContent = 'Zamknij formularz';
      btn.setAttribute('aria-expanded', 'true');
      formBox.querySelector('input[name=full_name]').focus();
    }
  });

  const safeUrl = w.more_info_url && /^https?:\/\//i.test(w.more_info_url) ? w.more_info_url : null;

  return h('article', { class: 'card' },
    h('h2', {}, w.title),
    w.description && h('p', { class: 'desc' }, w.description),
    info('Kiedy', h('ul', { class: 'sessions' },
      (w.sessions || []).map((s) =>
        h('li', {}, sessionLabel(s),
          s.location && h('span', { class: 'note' }, `Miejsce: ${s.location}`),
          s.note && h('span', { class: 'note' }, s.note))))),
    w.location && info('Gdzie', w.location),
    w.facilitator && info('Kto prowadzi', w.facilitator),
    w.audience && info('Dla kogo', w.audience),
    w.cost && info('Udział', w.cost),
    safeUrl && h('p', { class: 'more' }, h('a', { href: safeUrl, target: '_blank', rel: 'noopener' }, 'Więcej informacji')),
    h('p', { class: 'count' }, 'Zapisane osoby: ', countEl),
    btn,
    formBox);
}

function signupForm(w, formBox, countEl, btn) {
  const err = h('p', { class: 'error', role: 'alert' });
  const submit = h('button', { type: 'submit' }, 'Wyślij zgłoszenie');
  const id = `c-${w.id}`;

  const form = h('form', { novalidate: true },
    h('label', {}, 'Imię i nazwisko',
      h('input', { type: 'text', name: 'full_name', autocomplete: 'name', required: true, maxlength: '120' })),
    h('label', {}, 'Adres e-mail',
      h('input', { type: 'email', name: 'email', autocomplete: 'email', inputmode: 'email', required: true, maxlength: '254' })),
    h('div', { class: 'hp', 'aria-hidden': 'true' },
      h('label', {}, 'Nie wypełniaj tego pola', h('input', { type: 'text', name: 'website', tabindex: '-1', autocomplete: 'off' }))),
    h('div', { class: 'consent' },
      h('input', { type: 'checkbox', name: 'consent', id }),
      h('label', { for: id, style: 'font-weight:400' },
        `Wyrażam zgodę na przetwarzanie mojego imienia, nazwiska i adresu e-mail przez ${CONFIG.FOUNDATION_NAME} w celu obsługi zapisu na ten warsztat oraz kontaktu w jego sprawie (np. przypomnienie, zmiana terminu). `,
        CONFIG.PRIVACY_URL && h('a', { href: CONFIG.PRIVACY_URL, target: '_blank', rel: 'noopener' }, 'Polityka prywatności'),
        ' Mogę zrezygnować w każdej chwili.')),
    err,
    submit);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const name = form.full_name.value.trim();
    const email = form.email.value.trim();
    if (!name) { err.textContent = 'Wpisz imię i nazwisko.'; form.full_name.focus(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Wpisz poprawny adres e-mail.'; form.email.focus(); return; }
    if (!form.consent.checked) { err.textContent = ERRORS.consent_required; return; }
    if (form.website.value) { return; } // pułapka na boty

    submit.disabled = true;
    submit.textContent = 'Wysyłanie…';
    try {
      const res = await rpc('sign_up', { p_workshop_id: w.id, p_full_name: name, p_email: email, p_consent: true });
      countEl.textContent = String(Number(countEl.textContent) + 1);
      btn.remove();
      formBox.replaceChildren(successBox(w, res.cancel_token, email));
    } catch (ex) {
      err.textContent = errText(ex);
      submit.disabled = false;
      submit.textContent = 'Wyślij zgłoszenie';
    }
  });
  return form;
}

function successBox(w, token, email) {
  if (!CONFIG.SHOW_CANCEL_LINK) {
    return h('div', { class: 'success', role: 'status' },
      h('h3', {}, 'Dziękujemy, jesteś zapisany/a!'),
      h('p', {}, `Zapisaliśmy Cię na warsztat „${w.title}”.`),
      h('p', {}, `Wysłaliśmy potwierdzenie na adres ${email}. W wiadomości znajdziesz przycisk, którym możesz zrezygnować z udziału. Jeśli nie widzisz maila, sprawdź folder spam.`));
  }
  const link = `${location.origin}${location.pathname}?anuluj=${token}`;
  const input = h('input', { type: 'text', readonly: true, value: link, 'aria-label': 'Twój osobisty link do rezygnacji' });
  const copy = h('button', { type: 'button', class: 'secondary' }, 'Skopiuj link');
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(link); copy.textContent = 'Skopiowano'; }
    catch (e) { input.select(); }
  });
  return h('div', { class: 'success', role: 'status' },
    h('h3', {}, 'Dziękujemy, jesteś zapisany/a!'),
    h('p', {}, `Zapisaliśmy Cię na warsztat „${w.title}”.`),
    h('p', {}, 'Jeśli będziesz chcieć zrezygnować, użyj osobistego linku poniżej. Zachowaj go.'),
    h('div', { class: 'linkbox' }, input, copy));
}

// ---------- Rezygnacja ----------
async function renderCancel(token) {
  app.replaceChildren(h('p', { class: 'muted' }, 'Ładowanie…'));
  const back = h('p', {}, h('a', { href: location.pathname }, '← Wróć do listy warsztatów'));
  try {
    const infoRow = await rpc('get_signup', { p_token: token });
    if (!infoRow) throw new Error('not_found');
    if (infoRow.cancelled) {
      app.replaceChildren(h('article', { class: 'card' },
        h('h2', {}, 'Rezygnacja zapisana'),
        h('p', {}, `Zapis na warsztat „${infoRow.workshop_title}” został już anulowany.`), back));
      return;
    }
    const err = h('p', { class: 'error', role: 'alert' });
    const yes = h('button', { type: 'button' }, 'Tak, rezygnuję');
    yes.addEventListener('click', async () => {
      yes.disabled = true; err.textContent = '';
      try {
        await rpc('cancel_signup', { p_token: token });
        app.replaceChildren(h('article', { class: 'card' },
          h('h2', {}, 'Rezygnacja przyjęta'),
          h('p', {}, `Anulowaliśmy Twój zapis na warsztat „${infoRow.workshop_title}”. Dziękujemy, że dałeś/aś znać.`), back));
      } catch (ex) { err.textContent = errText(ex); yes.disabled = false; }
    });
    app.replaceChildren(h('article', { class: 'card' },
      h('h2', {}, 'Rezygnacja z warsztatu'),
      h('p', {}, `Czy na pewno chcesz zrezygnować z udziału w warsztacie „${infoRow.workshop_title}”?`),
      err, yes, ' ', h('a', { href: location.pathname, style: 'margin-left:12px' }, 'Nie, zostaję')));
  } catch (ex) {
    app.replaceChildren(h('article', { class: 'card' }, h('h2', {}, 'Nie znaleziono zapisu'), h('p', {}, errText(ex)), back));
  }
}

// ---------- Logotypy i stopka ----------
function setupBranding() {
  // Logo fundacji: jeśli plik istnieje, zastępuje tekst
  const logo = h('img', { src: CONFIG.LOGO, alt: CONFIG.FOUNDATION_NAME });
  logo.addEventListener('load', () => {
    document.getElementById('brandText').hidden = true;
    document.getElementById('brand').append(logo);
  });

  const f = document.getElementById('footer');
  if (CONFIG.FUNDER_LOGOS.length) {
    const box = h('div', { class: 'funders' });
    CONFIG.FUNDER_LOGOS.forEach((l) => {
      const img = h('img', { src: l.src, alt: l.alt });
      img.addEventListener('load', () => box.classList.add('show'));
      img.addEventListener('error', () => img.remove());
      box.append(img);
    });
    f.append(box);
  }
  if (CONFIG.FUNDING_NOTE) f.append(h('p', { class: 'funding-note' }, CONFIG.FUNDING_NOTE));
  f.append(CONFIG.WEBSITE_URL
    ? h('a', { href: CONFIG.WEBSITE_URL, target: '_blank', rel: 'noopener' }, CONFIG.FOUNDATION_NAME)
    : CONFIG.FOUNDATION_NAME);
  if (CONFIG.CONTACT_EMAIL) f.append(' · Kontakt: ', h('a', { href: `mailto:${CONFIG.CONTACT_EMAIL}` }, CONFIG.CONTACT_EMAIL));
}

// ---------- Start ----------
(async function init() {
  setupBranding();
  const token = new URLSearchParams(location.search).get('anuluj');
  if (token && /^[0-9a-f-]{36}$/i.test(token)) { renderCancel(token); return; }

  try {
    renderWorkshops(await rpc('get_workshops'));
  } catch (e) {
    app.replaceChildren(h('p', { class: 'error' }, 'Nie udało się wczytać warsztatów. Odśwież stronę lub spróbuj później.'));
  }
})();
</script>
</body>
</html>
