<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wyniki ankiet – panel fundacji</title>
<style>
  :root { --bg:#eceee6; --card:#fff; --ink:#12302f; --muted:#50605d; --accent:#03363f; --accent-dark:#0a4a55; --line:#d9ddd0; --bar:#9ba795; --error:#a3231b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:0 16px 48px; }
  .topbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding:22px 0 10px; }
  h1 { margin:0; font-size:1.6rem; } h2 { margin:0 0 8px; font-size:1.05rem; }
  .muted { color:var(--muted); font-size:.92rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, .btn { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:9px 16px; cursor:pointer; min-height:42px; text-decoration:none; display:inline-flex; align-items:center; }
  button:hover, .btn:hover { background:var(--accent-dark); }
  button.secondary, .btn.secondary { background:transparent; color:var(--accent-dark); border:1px solid var(--accent); }
  button.small, .btn.small { min-height:34px; padding:4px 12px; font-size:.9rem; }
  select, input[type=email], input[type=password] { font:inherit; padding:9px 11px; border:1px solid #b9b3a6; border-radius:8px; background:#fff; }
  label { display:grid; gap:4px; font-weight:600; font-size:.92rem; }
  .bar { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 3.2em; gap:10px; align-items:center; margin:4px 0; font-size:.93rem; }
  .bar .track { background:var(--bg); border-radius:6px; height:14px; overflow:hidden; }
  .bar .fill { background:var(--bar); height:100%; }
  .bar .n { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .avg { font-weight:700; }
  ul.texts { margin:6px 0 0; padding-left:18px; display:grid; gap:6px; }
  .error { color:var(--error); font-weight:600; }
  .login { max-width:400px; margin:60px auto 0; }
  form.grid { display:grid; gap:14px; }
  @media (max-width:560px) { .bar { grid-template-columns:1fr 1fr 3em; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const CONFIG = { SUPABASE_URL: 'https://rsqwcvbixkdfcxfgwhym.supabase.co', SUPABASE_KEY: 'sb_publishable_VDS7OzDzHnpGkFCKgigIKQ_Dn0yC54p' };
const root = document.getElementById('root');
const TZ = 'Europe/Warsaw';
const fmtDate = new Intl.DateTimeFormat('pl-PL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone: TZ });

// Etykiety pytań (te same klucze co w survey.html)
const Q = {
  q1: { type:'single', text:'1. Forma udziału', options:{ warsztaty:'warsztaty dla specjalistów', sieciujace:'spotkanie sieciujące (superwizja)' } },
  q2: { type:'multi', text:'2. Obszar pracy', options:{ pomoc_spoleczna:'pomoc społeczna', psychologia:'psychologia / psychoterapia', pedagogika:'pedagogika / edukacja', interwencja:'interwencja kryzysowa', zdrowie:'ochrona zdrowia', ngo:'organizacja pozarządowa', rodzina:'praca z rodziną' } },
  q3: { type:'matrix', text:'3. Funkcjonowanie w pracy pomocowej (1–5, średnia)', items:{ s1:'Rozpoznaję sygnały własnego przeciążenia w pracy', s2:'Potrafię stawiać granice w pracy pomocowej', s3:'Mam sposoby dbania o własną równowagę w pracy', s4:'Mam możliwość konsultowania trudnych sytuacji zawodowych', s5:'Wiem, gdzie szukać wsparcia w trudnej sytuacji zawodowej' } },
  q4: { type:'scale', text:'4. Współpraca i wymiana doświadczeń ze specjalistami (1–5)' },
  q5: { type:'multi', text:'5. Obszary, w których chcą się rozwijać', options:{ rownowaga:'własna równowaga i dobrostan', granice:'granice w pracy pomocowej', trudne_sytuacje:'trudne sytuacje zawodowe', komunikacja:'komunikacja z osobami korzystającymi ze wsparcia', wspolpraca:'współpraca ze specjalistami i instytucjami', wymiana:'wymiana doświadczeń / konsultacje' } },
  q6: { type:'single', text:'6. Obszar, w którym chcą wprowadzić zmianę', options:{ tak:'tak', nie:'nie', trudno:'trudno powiedzieć' }, textKey:'q6_text' },
  q7: { type:'multi', text:'7. Oczekiwania wobec spotkania', options:{ wskazowki:'praktyczne wskazówki', refleksja:'refleksja nad własnym funkcjonowaniem', narzedzia:'nowe sposoby pracy / narzędzia', wymiana:'wymiana doświadczeń', kontakty:'kontakty i współpraca', wiedza:'uporządkowanie / poszerzenie wiedzy' } },
  q8: { type:'text', text:'8. Najbardziej wartościowy efekt udziału' }
};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}

// ---------- Logowanie (ta sama sesja co w panelu) ----------
let session = null;
try { session = JSON.parse(localStorage.getItem('bf_admin')); } catch (e) { session = null; }
function saveSession(d, prev) {
  session = { access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+Math.max(60,(d.expires_in||3600)-60)*1000, email:(d.user&&d.user.email)||prev||'' };
  try { localStorage.setItem('bf_admin', JSON.stringify(session)); } catch (e) {}
}
function clearSession() { session = null; try { localStorage.removeItem('bf_admin'); } catch (e) {} }
async function authCall(grant, body) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, { method:'POST', headers:{ apikey:CONFIG.SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  const d = await res.json().catch(() => ({})); if (!res.ok) throw new Error('auth'); return d;
}
async function api(path) {
  if (!session) throw new Error('no_session');
  if (Date.now() > session.expires_at) {
    try { saveSession(await authCall('refresh_token', { refresh_token: session.refresh_token }), session.email); } catch (e) { clearSession(); throw new Error('no_session'); }
  }
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, { headers:{ apikey:CONFIG.SUPABASE_KEY, Authorization:`Bearer ${session.access_token}` } });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.message) || `HTTP ${res.status}`);
  return data;
}

function renderLogin(msg) {
  const err = h('p', { class:'error' }, msg || '');
  const form = h('form', { class:'grid' },
    h('label', {}, 'E-mail', h('input', { type:'email', name:'email', autocomplete:'username', required:true })),
    h('label', {}, 'Hasło', h('input', { type:'password', name:'password', autocomplete:'current-password', required:true })), err, h('button', { type:'submit' }, 'Zaloguj się'));
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    try { saveSession(await authCall('password', { email: form.email.value.trim(), password: form.password.value })); await start(); }
    catch (ex) { err.textContent = 'Nieprawidłowy e-mail lub hasło.'; }
  });
  root.replaceChildren(h('div', { class:'login card' }, h('h1', {}, 'Wyniki ankiet'), form));
}

// ---------- Dane i podsumowania ----------
const state = { rows: [], workshops: [], filter: '' };
async function start() {
  try {
    const staff = await api('staff?select=user_id');
    if (!staff.length) { root.replaceChildren(h('div', { class:'login card' }, h('p', {}, 'To konto nie ma dostępu do panelu.'))); return; }
    state.workshops = await api('workshops?select=id,title&order=created_at.desc');
    state.rows = await api('survey_responses?select=*&form=eq.pre&order=created_at.desc');
    render();
  } catch (e) {
    if (e.message === 'no_session') { renderLogin(); return; }
    root.replaceChildren(h('div', { class:'card' }, h('p', { class:'error' }, `Błąd: ${e.message}`),
      h('p', { class:'muted' }, 'Jeśli to pierwsza wizyta, upewnij się, że uruchomiono migration-5.sql w Supabase.')));
  }
}

function filtered() { return state.rows.filter((r) => !state.filter || (state.filter === 'none' ? !r.workshop_id : r.workshop_id === state.filter)); }
const wsTitle = (id) => (state.workshops.find((w) => w.id === id) || {}).title || '—';

function barRow(label, n, total) {
  const pct = total ? Math.round((n / total) * 100) : 0;
  return h('div', { class:'bar' }, h('span', {}, label), h('div', { class:'track' }, h('div', { class:'fill', style:`width:${pct}%` })), h('span', { class:'n' }, `${n} (${pct}%)`));
}
const avg = (arr) => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : null;

function summaryCards(rows) {
  const total = rows.length; const out = [];
  for (const [key, q] of Object.entries(Q)) {
    const card = h('div', { class:'card' }, h('h2', {}, q.text));
    if (q.type === 'single' || q.type === 'multi') {
      const answered = rows.filter((r) => q.type === 'single' ? r.answers[key] : (r.answers[key] || []).length || r.answers[key + '_other']);
      for (const [v, label] of Object.entries(q.options)) {
        const n = rows.filter((r) => q.type === 'single' ? r.answers[key] === v : (r.answers[key] || []).includes(v)).length;
        card.append(barRow(label, n, total));
      }
      const others = rows.map((r) => r.answers[key + '_other']).filter(Boolean);
      if (others.length) card.append(h('p', { class:'muted', style:'margin:8px 0 0' }, 'Inne:'), h('ul', { class:'texts' }, others.map((t) => h('li', {}, t))));
      if (q.textKey) { const ts = rows.map((r) => r.answers[q.textKey]).filter(Boolean);
        if (ts.length) card.append(h('p', { class:'muted', style:'margin:8px 0 0' }, 'Czego miałaby dotyczyć zmiana:'), h('ul', { class:'texts' }, ts.map((t) => h('li', {}, t)))); }
    } else if (q.type === 'matrix') {
      for (const [k, label] of Object.entries(q.items)) {
        const vals = rows.map((r) => (r.answers[key] || {})[k]).filter((x) => x);
        const a = avg(vals);
        card.append(h('div', { class:'bar' }, h('span', {}, label), h('div', { class:'track' }, h('div', { class:'fill', style:`width:${a ? (a / 5) * 100 : 0}%` })),
          h('span', { class:'n avg' }, a ? a.toFixed(2) : '—')));
      }
    } else if (q.type === 'scale') {
      const vals = rows.map((r) => r.answers[key]).filter((x) => x); const a = avg(vals);
      card.append(h('p', { class:'avg', style:'margin:0 0 6px' }, a ? `Średnia: ${a.toFixed(2)}` : 'Brak odpowiedzi'));
      for (let i = 1; i <= 5; i++) card.append(barRow(String(i), vals.filter((x) => x === i).length, total));
    } else if (q.type === 'text') {
      const ts = rows.map((r) => r.answers[key]).filter(Boolean);
      card.append(ts.length ? h('ul', { class:'texts' }, ts.map((t) => h('li', {}, t))) : h('p', { class:'muted' }, 'Brak odpowiedzi'));
    }
    out.push(card);
  }
  return out;
}

function csv(rows) {
  const cols = [['Data', (r) => fmtDate.format(new Date(r.created_at))], ['Warsztat', (r) => r.workshop_id ? wsTitle(r.workshop_id) : '']];
  for (const [key, q] of Object.entries(Q)) {
    if (q.type === 'single') cols.push([q.text, (r) => q.options[r.answers[key]] || '']);
    else if (q.type === 'multi') { cols.push([q.text, (r) => (r.answers[key] || []).map((v) => q.options[v]).join(', ')]); cols.push([q.text + ' – inne', (r) => r.answers[key + '_other'] || '']); }
    else if (q.type === 'matrix') for (const [k, label] of Object.entries(q.items)) cols.push([`3. ${label}`, (r) => (r.answers[key] || {})[k] ?? '']);
    else if (q.type === 'scale') cols.push([q.text, (r) => r.answers[key] ?? '']);
    else cols.push([q.text, (r) => r.answers[key] || '']);
    if (q.textKey) cols.push([q.text + ' – opis', (r) => r.answers[q.textKey] || '']);
  }
  const esc = (v) => `"${String(v).replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`;
  const text = '﻿' + [cols.map((c) => esc(c[0])).join(';'), ...rows.map((r) => cols.map((c) => esc(c[1](r))).join(';'))].join('\r\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type:'text/csv;charset=utf-8' })), download: 'ankiety-PRE.csv' });
  document.body.append(a); a.click(); a.remove();
}

function render() {
  const rows = filtered();
  const used = [...new Set(state.rows.map((r) => r.workshop_id).filter(Boolean))];
  const sel = h('select', { 'aria-label':'Filtr warsztatu', onchange: (e) => { state.filter = e.target.value; render(); } },
    h('option', { value:'' }, `Wszystkie warsztaty (${state.rows.length})`),
    used.map((id) => h('option', { value:id }, `${wsTitle(id)} (${state.rows.filter((r) => r.workshop_id === id).length})`)),
    state.rows.some((r) => !r.workshop_id) && h('option', { value:'none' }, `Bez wskazanego warsztatu (${state.rows.filter((r) => !r.workshop_id).length})`));
  sel.value = state.filter;
  root.replaceChildren(
    h('div', { class:'topbar' }, h('h1', {}, 'Wyniki ankiet PRE'),
      h('div', { class:'row' }, h('span', { class:'muted' }, session && session.email), h('a', { class:'btn secondary small', href:'admin.html' }, '← Panel warsztatów'),
        h('button', { class:'secondary small', onclick: () => { clearSession(); renderLogin(); } }, 'Wyloguj'))),
    h('div', { class:'card' }, h('div', { class:'row' }, sel, h('strong', {}, `Wypełnień: ${rows.length}`),
      h('button', { class:'small', onclick: () => csv(rows), disabled: rows.length ? null : 'true' }, 'Pobierz CSV')),
      h('p', { class:'muted', style:'margin:8px 0 0' }, 'Ankiety są anonimowe. Ankiety papierowe możecie wpisać przez ten sam formularz (survey.html).')),
    rows.length ? summaryCards(rows) : h('p', { class:'muted' }, 'Brak wypełnionych ankiet dla tego wyboru.'));
}
start();
</script>
</body>
</html>
